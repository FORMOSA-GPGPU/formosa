name: Publish Docker image

on:
  pull_request:
    paths:
      - .github/scripts/push-image.sh
      - .github/workflows/formosa-regression.yml
      - .github/workflows/publish-docker.yml
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-formosa-docker-${{ github.ref }}
  queue: max

jobs:
  resolve:
    name: Resolve Docker environment
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      cache_hit: ${{ steps.image.outputs.cache_hit }}
      environment_tag: ${{ steps.image.outputs.environment_tag }}
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Docker images may only be published from main"
          exit 1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Resolve fingerprint image
        id: image
        env:
          IMAGE_NAME: ghcr.io/formosa-gpgpu/formosa
        run: |
          set -euo pipefail
          fingerprint_path=$(nix eval \
            --no-update-lock-file \
            --no-write-lock-file \
            --raw .#formosa-docker-env-fingerprint.drvPath)
          fingerprint_name=${fingerprint_path##*/}
          environment_id=${fingerprint_name%%-*}
          [[ "$environment_id" =~ ^[0-9a-z]{32}$ ]]

          environment_tag="nix-$environment_id"
          environment_ref="$IMAGE_NAME:$environment_tag"
          echo "environment_tag=$environment_tag" >>"$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "Forcing a rebuild of $environment_tag"
            echo "cache_hit=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          error_log="$RUNNER_TEMP/ghcr-inspect-error.log"
          if digest_json=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "$environment_ref" 2>"$error_log"); then
            digest=$(jq -r . <<<"$digest_json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "Reusing $environment_ref ($digest)"
            echo "cache_hit=true" >>"$GITHUB_OUTPUT"
            echo "image_ref=$IMAGE_NAME@$digest" >>"$GITHUB_OUTPUT"
          elif grep -Fqi "$environment_ref: not found" "$error_log" ||
            grep -Eqi 'manifest unknown|name unknown' "$error_log"; then
            echo "No image for $environment_tag; a build is required"
            echo "cache_hit=false" >>"$GITHUB_OUTPUT"
          else
            cat "$error_log" >&2
            exit 1
          fi

  validate:
    name: Validate workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate workflow and helper
        run: |
          nix shell --inputs-from . \
            nixpkgs#actionlint \
            nixpkgs#shellcheck \
            --command bash -euo pipefail -c '
              actionlint -shellcheck shellcheck \
                -ignore "unexpected key \"queue\" for \"concurrency\"" \
                .github/workflows/formosa-regression.yml \
                .github/workflows/publish-docker.yml
              shellcheck .github/scripts/push-image.sh
            '

  publish:
    name: Build and publish
    needs: resolve
    if: ${{ needs.resolve.result == 'success' && needs.resolve.outputs.cache_hit == 'false' }}
    runs-on: ${{ vars.DOCKER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/formosa-gpgpu/formosa
      ENVIRONMENT_TAG: ${{ needs.resolve.outputs.environment_tag }}
    steps:
      - name: Initialize runner paths and report disk usage
        run: |
          echo "ATTIC_PROFILE=$RUNNER_TEMP/formosa-attic-profile" >>"$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/formosa-xdg-cache" >>"$GITHUB_ENV"
          df -h /

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Attic
        env:
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_SERVER: ${{ secrets.ATTIC_SERVER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ATTIC_CACHE" || {
            echo "::error::ATTIC_CACHE repository variable is not configured"
            exit 1
          }
          test -n "$ATTIC_SERVER" || {
            echo "::error::ATTIC_SERVER repository secret is not configured"
            exit 1
          }
          test -n "$ATTIC_TOKEN" || {
            echo "::error::ATTIC_TOKEN repository secret is not configured"
            exit 1
          }
          echo "::add-mask::$ATTIC_SERVER"
          nix profile add \
            --profile "$ATTIC_PROFILE" \
            --inputs-from . \
            nixpkgs#attic-client
          "$ATTIC_PROFILE/bin/attic" login \
            formosa "$ATTIC_SERVER" "$ATTIC_TOKEN" >/dev/null
          "$ATTIC_PROFILE/bin/attic" use "formosa:$ATTIC_CACHE" >/dev/null

      - name: Report disk usage after setup
        run: df -h / /nix

      - name: Build image archive
        run: |
          nix build .#formosa-docker-env \
            --print-build-logs \
            --option download-attempts 3
          test -s result
          df -h / /nix

      - name: Preserve archive and reclaim Nix store
        id: archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/formosa-docker-env.tar.gz"
          cp --dereference result "$archive"
          rm result
          nix profile remove --profile "$ATTIC_PROFILE" attic-client
          nix profile wipe-history --profile "$ATTIC_PROFILE"
          rm -rf -- "$XDG_CACHE_HOME/nix"
          nix store gc
          test -s "$archive"
          available_kib=$(df --output=avail / | tail -n 1)
          minimum_kib=$((7 * 1024 * 1024))
          if ((available_kib < minimum_kib)); then
            echo "::error::Only $((available_kib / 1024 / 1024)) GiB is free; Docker load requires at least 7 GiB"
            exit 1
          fi
          echo "archive=$archive" >>"$GITHUB_OUTPUT"
          df -h / /nix

      - name: Load and tag image
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -euo pipefail
          docker load --input "$ARCHIVE"
          image_id=$(docker image ls \
            --filter 'reference=formosa:*' \
            --format '{{.ID}}' | head -n 1)
          test -n "$image_id"
          test "$(docker image inspect \
            --format '{{.Os}}/{{.Architecture}}' "$image_id")" = linux/amd64
          docker tag "$image_id" "$IMAGE_NAME:sha-$GITHUB_SHA"
          rm "$ARCHIVE"
          df -h / /var/lib/docker

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Push immutable tag
        id: push
        run: |
          set -euo pipefail
          image="$IMAGE_NAME:sha-$GITHUB_SHA"
          log="$RUNNER_TEMP/docker-push.log"
          bash .github/scripts/push-image.sh "$image" "$log"
          digest=$(sed -nE \
            's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$log" | tail -n 1)
          test -n "$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_NAME@$digest" >>"$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Publish fingerprint tag
        env:
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE_NAME:$ENVIRONMENT_TAG" \
            "$IMAGE_REF"
          fingerprint_digest=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "$IMAGE_NAME:$ENVIRONMENT_TAG" | jq -r .)
          test "$fingerprint_digest" = "$EXPECTED_DIGEST"

  regression:
    name: Regression
    needs:
      - resolve
      - publish
    if: >-
      ${{ always() &&
          needs.resolve.result == 'success' &&
          (needs.resolve.outputs.cache_hit == 'true' ||
           needs.publish.result == 'success') }}
    uses: ./.github/workflows/formosa-regression.yml
    with:
      image: ${{ needs.publish.outputs.image_ref || needs.resolve.outputs.image_ref }}
    permissions:
      contents: read

  promote:
    name: Promote latest
    needs:
      - resolve
      - publish
      - regression
    if: >-
      ${{ always() &&
          needs.resolve.result == 'success' &&
          needs.regression.result == 'success' &&
          (needs.resolve.outputs.cache_hit == 'true' ||
           needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      IMAGE_NAME: ghcr.io/formosa-gpgpu/formosa
      IMAGE_REF: ${{ needs.publish.outputs.image_ref || needs.resolve.outputs.image_ref }}
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Update latest tag
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_REF"
          latest_digest=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "$IMAGE_NAME:latest" | jq -r .)
          candidate_digest=${IMAGE_REF##*@}
          test "$latest_digest" = "$candidate_digest"

  public-ci:
    name: Public CI
    if: ${{ always() && needs.resolve.result != 'skipped' }}
    needs:
      - resolve
      - publish
      - regression
      - promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require regression
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: |
          set -euo pipefail
          test "$RESOLVE_RESULT" = success
          test "$REGRESSION_RESULT" = success
          test "$PROMOTE_RESULT" = success
