name: Publish Docker image

on:
  pull_request:
    paths:
      - .github/scripts/push-image.sh
      - .github/workflows/formosa-regression.yml
      - .github/workflows/publish-docker.yml
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-formosa-docker-${{ github.ref }}
  queue: max

jobs:
  detect:
    name: Detect image changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      image_affecting: ${{ steps.changes.outputs.image_affecting }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          from=$PUSH_BASE_SHA
          if [[ "$from" =~ ^0+$ || -z "$from" ]]; then
            from="$GITHUB_SHA^"
          fi

          image_affecting=true
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]] &&
            git diff --quiet "$from" "$GITHUB_SHA" -- \
              ':(glob)**/*.nix' \
              flake.lock \
              CMakeLists.txt \
              FormosaConfig.cmake.in \
              'cmake/**' \
              'addr_map/**' \
              'fw/**' \
              'hal/**' \
              'libcomm/**' \
              third-party/FreeRTOS-Kernel.cmake \
              .github/scripts/push-image.sh \
              .github/workflows/publish-docker.yml; then
            image_affecting=false
          fi
          echo "image_affecting=$image_affecting" >>"$GITHUB_OUTPUT"

  validate:
    name: Validate workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate workflow and helper
        run: |
          nix shell --inputs-from . \
            nixpkgs#actionlint \
            nixpkgs#shellcheck \
            --command bash -euo pipefail -c '
              actionlint -shellcheck shellcheck \
                -ignore "unexpected key \"queue\" for \"concurrency\"" \
                .github/workflows/formosa-regression.yml \
                .github/workflows/publish-docker.yml
              shellcheck .github/scripts/push-image.sh
            '

  publish:
    name: Build and publish
    needs: detect
    if: ${{ needs.detect.result == 'success' && needs.detect.outputs.image_affecting == 'true' }}
    runs-on: ${{ vars.DOCKER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/formosa-gpgpu/formosa
    steps:
      - name: Initialize runner paths and report disk usage
        run: |
          echo "ATTIC_PROFILE=$RUNNER_TEMP/formosa-attic-profile" >>"$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/formosa-xdg-cache" >>"$GITHUB_ENV"
          df -h /

      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Docker images may only be published from main"
          exit 1

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Attic
        env:
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_SERVER: ${{ secrets.ATTIC_SERVER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ATTIC_CACHE" || {
            echo "::error::ATTIC_CACHE repository variable is not configured"
            exit 1
          }
          test -n "$ATTIC_SERVER" || {
            echo "::error::ATTIC_SERVER repository secret is not configured"
            exit 1
          }
          test -n "$ATTIC_TOKEN" || {
            echo "::error::ATTIC_TOKEN repository secret is not configured"
            exit 1
          }
          echo "::add-mask::$ATTIC_SERVER"
          nix profile add \
            --profile "$ATTIC_PROFILE" \
            --inputs-from . \
            nixpkgs#attic-client
          "$ATTIC_PROFILE/bin/attic" login \
            formosa "$ATTIC_SERVER" "$ATTIC_TOKEN" >/dev/null
          "$ATTIC_PROFILE/bin/attic" use "formosa:$ATTIC_CACHE" >/dev/null

      - name: Report disk usage after setup
        run: df -h / /nix

      - name: Build image archive
        run: |
          nix build .#formosa-docker-env \
            --print-build-logs \
            --option download-attempts 3
          test -s result
          df -h / /nix

      - name: Preserve archive and reclaim Nix store
        id: archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/formosa-docker-env.tar.gz"
          cp --dereference result "$archive"
          rm result
          nix profile remove --profile "$ATTIC_PROFILE" attic-client
          nix profile wipe-history --profile "$ATTIC_PROFILE"
          rm -rf -- "$XDG_CACHE_HOME/nix"
          nix store gc
          test -s "$archive"
          available_kib=$(df --output=avail / | tail -n 1)
          minimum_kib=$((7 * 1024 * 1024))
          if ((available_kib < minimum_kib)); then
            echo "::error::Only $((available_kib / 1024 / 1024)) GiB is free; Docker load requires at least 7 GiB"
            exit 1
          fi
          echo "archive=$archive" >>"$GITHUB_OUTPUT"
          df -h / /nix

      - name: Load and tag image
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          set -euo pipefail
          docker load --input "$ARCHIVE"
          image_id=$(docker image ls \
            --filter 'reference=formosa:*' \
            --format '{{.ID}}' | head -n 1)
          test -n "$image_id"
          test "$(docker image inspect \
            --format '{{.Os}}/{{.Architecture}}' "$image_id")" = linux/amd64
          docker tag "$image_id" "$IMAGE_NAME:sha-$GITHUB_SHA"
          rm "$ARCHIVE"
          df -h / /var/lib/docker

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Push immutable tag
        id: push
        run: |
          set -euo pipefail
          image="$IMAGE_NAME:sha-$GITHUB_SHA"
          log="$RUNNER_TEMP/docker-push.log"
          bash .github/scripts/push-image.sh "$image" "$log"
          digest=$(sed -nE \
            's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$log" | tail -n 1)
          test -n "$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_NAME@$digest" >>"$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  regression:
    name: Regression
    needs:
      - detect
      - publish
    if: >-
      ${{ always() &&
          needs.detect.result == 'success' &&
          (needs.detect.outputs.image_affecting == 'false' ||
           needs.publish.result == 'success') }}
    uses: ./.github/workflows/formosa-regression.yml
    with:
      image: ${{ needs.publish.outputs.image_ref || 'ghcr.io/formosa-gpgpu/formosa:latest' }}
    permissions:
      contents: read

  promote:
    name: Promote latest
    needs:
      - publish
      - regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      IMAGE_NAME: ghcr.io/formosa-gpgpu/formosa
      IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Update latest tag
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_REF"
          latest_digest=$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' \
            "$IMAGE_NAME:latest" | jq -r .)
          candidate_digest=${IMAGE_REF##*@}
          test "$latest_digest" = "$candidate_digest"

  public-ci:
    name: Public CI
    if: ${{ always() && needs.detect.result != 'skipped' }}
    needs:
      - detect
      - publish
      - regression
      - promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require regression
        env:
          IMAGE_AFFECTING: ${{ needs.detect.outputs.image_affecting }}
          DETECT_RESULT: ${{ needs.detect.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        run: |
          set -euo pipefail
          test "$DETECT_RESULT" = success
          test "$REGRESSION_RESULT" = success
          if [[ "$IMAGE_AFFECTING" == true ]]; then
            test "$PROMOTE_RESULT" = success
          fi
