name: FORMOSA regression

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      image:
        required: true
        type: string

permissions:
  contents: read

env:
  FORMOSA_CI_DEFAULT_IMAGE: ghcr.io/formosa-gpgpu/formosa:latest

jobs:
  plan:
    name: Lint and plan regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
      base: ${{ steps.range.outputs.base }}
      head: ${{ steps.range.outputs.head }}
      use_all: ${{ steps.range.outputs.use_all }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select regression range
        id: range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            from=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
            to=$PR_HEAD_SHA
            git cat-file -e "$from^{commit}"
            git cat-file -e "$to^{commit}"
            {
              echo "base=$from"
              echo "head=$to"
              echo "use_all=false"
            } >>"$GITHUB_OUTPUT"
          else
            echo "use_all=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Check third-party changes
        if: steps.range.outputs.use_all != 'true'
        env:
          LINT_FROM: ${{ steps.range.outputs.base }}
          LINT_TO: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          submodule_re='^third-party/(systemc|sol2|DRAMSys|fmt|argparse|elfio|'
          submodule_re+='perfetto|glm|tomlplusplus|Catch2|softfloat|FreeRTOS-Kernel|'
          submodule_re+='riscv-opcodes|riscv-tests|quill|DRAMUtils|nlohmann_json)(/|$)'
          blocked=()
          warned=()
          while IFS= read -r -d '' path; do
            if [[ "$path" =~ $submodule_re ]]; then
              blocked+=("$path")
            else
              warned+=("$path")
            fi
          done < <(
            git diff --name-only -z --diff-filter=ACDMRTUXB \
              "$LINT_FROM" "$LINT_TO" -- third-party/
          )
          if ((${#warned[@]})); then
            echo '::warning title=third-party files changed::CONTRIBUTING.md asks contributors to avoid third-party changes unless requested by a maintainer.'
            printf 'Third-party changes:\n  %s\n' "${warned[@]}"
          fi
          if ((${#blocked[@]})); then
            echo '::error title=expanded submodule changed::These files are exported from internal submodules. Ask a maintainer to update the internal submodule revision instead.'
            printf 'Expanded submodule changes:\n  %s\n' "${blocked[@]}"
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate workflow definitions
        run: |
          set -euo pipefail
          nix shell --inputs-from . nixpkgs#xmake --command xmake workflow check

      - name: Resolve FORMOSA environment
        id: image
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          image=${REQUESTED_IMAGE:-$FORMOSA_CI_DEFAULT_IMAGE}
          docker pull "$image"
          image_ref=$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "$image")
          [[ "$image_ref" =~ ^ghcr\.io/formosa-gpgpu/formosa@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image_ref" >>"$GITHUB_OUTPUT"

      - name: Lint changed files
        if: steps.range.outputs.use_all != 'true'
        env:
          LINT_FROM: ${{ steps.range.outputs.base }}
          LINT_TO: ${{ steps.range.outputs.head }}
          FORMOSA_CI_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env TMP=/tmp \
            --env TEMP=/tmp \
            --env TEMPDIR=/tmp \
            --env TMPDIR=/tmp \
            --env NIX_BUILD_TOP=/tmp \
            --tmpfs /tmp:rw,exec,mode=1777 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$FORMOSA_CI_IMAGE" \
            bash -c '
              set -eo pipefail
              set +u
              rc=(/nix/store/*-nix-shell-rc)
              if (( ${#rc[@]} != 1 )); then
                printf "expected one Nix shell rc, found %d\n" "${#rc[@]}" >&2
                exit 1
              fi
              source "${rc[0]}"
              set -euo pipefail

              status=0
              pre-commit run --from-ref "$1" --to-ref "$2" || status=$?
              git diff --no-ext-diff
              exit "$status"
            ' bash "$LINT_FROM" "$LINT_TO"

  regression:
    name: Regression (regression.debug)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FORMOSA_CI_IMAGE: ${{ needs.plan.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Record regression environment
        run: |
          set -euo pipefail
          mkdir -p build
          {
            printf 'Commit: %s\n' "$(git rev-parse HEAD)"
            printf 'Image: %s\n' "$FORMOSA_CI_IMAGE"
            printf 'Run: %s/%s/actions/runs/%s (attempt %s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Started at: %s\n' "$(date --utc --iso-8601=seconds)"
            lscpu
            free -h
            df -h /
          } | tee build/regression-environment.log

      - name: Pull FORMOSA environment
        run: docker pull "$FORMOSA_CI_IMAGE"

      - name: Build and test affected suites
        env:
          REGRESSION_BASE: ${{ needs.plan.outputs.base }}
          REGRESSION_HEAD: ${{ needs.plan.outputs.head }}
          REGRESSION_USE_ALL: ${{ needs.plan.outputs.use_all }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env TMP=/tmp \
            --env TEMP=/tmp \
            --env TEMPDIR=/tmp \
            --env TMPDIR=/tmp \
            --env NIX_BUILD_TOP=/tmp \
            --tmpfs /tmp:rw,exec,mode=1777 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$FORMOSA_CI_IMAGE" \
            bash -c '
              set -eo pipefail
              set +u
              rc=(/nix/store/*-nix-shell-rc)
              if (( ${#rc[@]} != 1 )); then
                printf "expected one Nix shell rc, found %d\n" "${#rc[@]}" >&2
                exit 1
              fi
              source "${rc[0]}"
              set -euo pipefail

              # Match the four-vCPU GitHub-hosted runner.
              jobs=4
              {
                xmake --version
                printf "Configured build/test jobs: %s\n" "$jobs"
              } | tee -a build/regression-environment.log

              xmake lua xmake/tests/workflow.lua
              use_all=$3
              if [[ "$use_all" != true ]] && git diff --name-only "$1" "$2" -- \
                  workflows.lua xmake/ xmake.lua formosa-sdk-xmake.lua \
                  .github/ | grep -q .; then
                echo "Workflow definition changed; running full regression."
                use_all=true
              fi
              args=(workflow regression --profile=debug --execute --jobs="$jobs")
              if [[ "$use_all" == true ]]; then
                args+=(--all)
              else
                args+=(--base "$1" --head "$2")
              fi
              {
                printf "Command:"
                printf " %q" xmake "${args[@]}"
                printf "\n"
              } >> build/regression-environment.log
              xmake "${args[@]}"
            ' bash "$REGRESSION_BASE" "$REGRESSION_HEAD" "$REGRESSION_USE_ALL"

      - name: Upload regression diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-debug-diagnostics-${{ github.run_attempt }}
          retention-days: 7
          # Xmake stores test logs under the hidden .gens directory.
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            build/regression-environment.log
            build/.gens/**/tests/**/*.stdout.log
            build/.gens/**/tests/**/*.stderr.log
            build/.gens/**/tests/**/*.errors.log

  public-ci:
    name: Public CI
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - plan
      - regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require lint and regression
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$REGRESSION_RESULT" = success
